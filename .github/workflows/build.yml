name: build

on:
  schedule:
    - cron: "0 11,23 * * *" # 06:00 and 18:00 UTC-5
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "*/PKGBUILD"
      - packages.txt
      - build.sh

permissions:
  contents: write

concurrency:
  group: build

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: pacman -Syu --noconfirm git github-cli jq pacman-contrib

      - uses: actions/checkout@v4

      - name: Import signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import

      - run: ./build.sh

      - name: Commit bumped PKGBUILDs
        run: |
          git config --global --add safe.directory "$PWD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*/PKGBUILD' '*/.SRCINFO'
          git diff --cached --quiet && exit 0
          git commit -m "update: $(git diff --cached --name-only | cut -d/ -f1 | sort -u | xargs)"
          git push
